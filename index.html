<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 100% votos</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#111111;--mute:#777777;--line:#dddddd;--green:#12c26b;--lula:#d62839;--flavio:#b08a00;--barf:#ffd21f;--up:#0a8f4a;--down:#d62828;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:34px;margin:0;font-weight:800;letter-spacing:-.5px}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#03170d;font-weight:800;padding:6px 14px;border-radius:99px}
.live i{width:10px;height:10px;border-radius:50%;background:#03170d;animation:blink 1.1s cubic-bezier(.65,0,.35,1) infinite}
@keyframes blink{50%{opacity:.15;transform:scale(.6)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.duel{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cand{flex:1}.cand.r{text-align:right}
.cand b{display:block;font-size:22px}
.cand .pct{font-size:clamp(44px,12vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cand .n{color:var(--mute);font-variant-numeric:tabular-nums}
.lula{color:var(--lula)}.flavio{color:var(--flavio)}
.track{position:relative;height:30px;border-radius:8px;overflow:hidden;background:var(--line);display:flex;margin-top:14px}
.track.sm{height:14px;margin:0}
.seg{height:100%;transition:width 1.1s cubic-bezier(.65,0,.35,1)}
.seg.l{background:var(--lula)}.seg.f{background:var(--barf)}
.mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:.9}
.sweep{position:absolute;top:0;left:0;height:100%;width:22%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(18, 194, 106, 0),transparent);animation:sweep 2.6s cubic-bezier(.76,0,.24,1) infinite alternate}
.track.sm .sweep{animation-duration:3.2s}
@keyframes sweep{from{transform:translateX(-10%)}to{transform:translateX(355%)}}
.lead{margin-top:10px;color:var(--mute);text-align:center;font-weight:600}
h2{font-size:22px;margin:26px 0 0}
.legend{color:var(--mute);margin:4px 0 0;font-size:16px}
.head,.row{display:grid;grid-template-columns:minmax(120px,1.3fr) 130px minmax(120px,2fr) 130px;gap:12px;align-items:center}
.head{color:var(--mute);font-weight:700;padding:0 14px;margin-top:12px}
.head span:nth-child(2){color:var(--lula);text-align:right}.head span:nth-child(4){color:var(--flavio);text-align:right}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:36px;height:27px;object-fit:contain;border-radius:3px;flex:none}
.fb{width:36px;height:27px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--line);color:var(--ink);font-weight:800;font-size:15px}
.who b{font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ic{font-size:22px;margin-right:6px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;cursor:help}
.bar small{display:flex;justify-content:space-between;margin-top:4px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);margin-top:12px}

/* comparação com o 1º turno */
.dif{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;cursor:help}
.dif.up{color:var(--up)}
.dif.down{color:var(--down)}
.dif.eq{color:var(--mute)}
.cand .dif{font-size:17px;margin-top:2px}
.t1{display:block;font-size:13px;font-weight:600;color:#999;font-variant-numeric:tabular-nums}
.cand .t1{font-size:15px}

/* impressão: mantém cores e bandeiras, esconde o que não faz sentido no papel */
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .live,.botoes,.sweep{display:none}
 .wrap{padding:0;max-width:none}
 .row,.panel{break-inside:avoid}
 .seg{transition:none}
}

@media (max-width:640px){
 .head{display:none}
 .row{grid-template-columns:1fr 1fr;gap:10px}
 .who{grid-column:1/-1}
 .bar{grid-column:1/-1;order:5}
 .num.lula{text-align:left}
}
@media (prefers-reduced-motion:reduce){.sweep,.live i{animation:none}.seg{transition:none}}

.botoes{
  display: flex;
  flex-direction: row;
  gap: 10px;
  justify-content: center;
}

.botoes a{
  padding: 10px;
  background-color: #fff;
  border: 1px solid #111;
  text-decoration: none;
  color: #111;
  border-radius: 10px;
}
.botoes a:active{
  background-color: #111;
  color: #fff;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Apuração</h1>
    <span class="live"><i></i>AO VIVO</span>
  </header>

  <section class="panel" aria-label="Total mundial">
    <div class="duel">
      <div class="cand"><b class="lula">Lula</b><span class="pct lula" id="pl">0%</span><div class="n" id="nl">0 votos</div><span class="dif" id="dl"></span></div>
      <div class="cand r"><b class="flavio">Flávio</b><span class="pct flavio" id="pf">0%</span><div class="n" id="nf">0 votos</div><span class="dif" id="df"></span></div>
    </div>
    <div class="track"><div class="seg l" id="bl" style="width:50%"></div><div class="seg f" id="bf" style="width:50%"></div><div class="mid"></div><div class="sweep"></div></div>
    <div class="lead" id="lead"></div>
  </section>

  <h2>Votos por estados</h2>
  <div class="botoes">
    <a href="nor.html">Norte</a>
    <a href="nde.html">Nordeste</a>
    <a href="coe.html">Centro-oeste</a>
    <a href="sul.html">Sul</a>
    <a href="sud.html">Sudeste</a>
  </div>
  <div class="head"><span>Local</span><span>Lula</span><span>Disputa</span><span>Flávio</span></div>
  <div id="list"></div>
  <p class="empty" id="empty">Apuração em andamento. Os primeiros resultados aparecem aqui.</p>
</div>

<script>
/* ============================================================
   EDITE AQUI: uma linha por país ou estado (2º TURNO)
   ["SIGLA", votos Lula, votos Flávio, "parcial" ou "total"],
   - País: "PT", "US", "JP"...   Estado brasileiro: "BR-SP", "BR-AL"...
   - "parcial" = ainda apurando → líder ganha 🕒
   - "total"   = apuração concluída → vencedor ganha 🏆
   - Opcional, 5º item: link de imagem da bandeira (se a automática falhar)
     ex.: ["BR-AL", 3000, 1200, "total", "https://site.com/bandeira.png"]
   Depois salve e suba o arquivo de novo.
   ============================================================ */
var PAISES = [
  ["BR-AC", 144513, 287715, "parcial", 'file/ac.png'],
  ["BR-AL", 1152621, 744140, "parcial", 'file/al.png'],
  ["BR-AP", 222968, 198674, "parcial", 'file/ap.png'],
  ["BR-AM", 1145639, 975226, "parcial", 'file/am.png'],
  ["BR-BA", 6484995, 2608722, "parcial", 'file/ba.png'],
  ["BR-CE", 4036124, 1819478, "parcial", 'file/ce.png'],
  ["BR-DF", 825224, 979542, "parcial", 'file/df.png'],
  ["BR-ES", 1001965, 1294504, "parcial", 'file/es.png'],
  ["BR-GO", 1585555, 2345334, "parcial", 'file/go.png'],
  ["BR-MA", 2806744, 1229551, "parcial", 'file/ma.png'],
  ["BR-MT", 694167, 1351099, "parcial", 'file/mt.png'],
  ["BR-MS", 628973, 927892, "parcial", 'file/ms.png'],
  ["BR-MG", 6337950, 6235131, "parcial", 'file/mg.png'],
  ["BR-PA", 2689964, 2199754, "parcial", 'file/pa.png'],
  ["BR-PB", 1794059, 865210, "parcial", 'file/pb.png'],
  ["BR-PR", 2566504, 4291444, "parcial", 'file/pr.png'],
  ["BR-PE", 4117513, 1832554, "parcial", 'file/pe.png'],
  ["BR-PI", 1653989, 525859, "parcial", 'file/pi.png'],
  ["BR-RJ", 4565286, 5168902, "parcial", 'file/rj.png'],
  ["BR-RN", 1413596, 737409, "parcial", 'file/rn.png'],
  ["BR-RS", 2824552, 3874378, "parcial", 'file/rs.png'],
  ["BR-RO", 294446, 674382, "parcial", 'file/ro.png'],
  ["BR-RR", 83505, 219675, "parcial", 'file/rr.png'],
  ["BR-SC", 1418314, 3220071, "parcial", 'file/sc.png'],
  ["BR-SP", 12119274, 14139178, "parcial", 'file/sp.png'],
  ["BR-SE", 989041, 433354, "parcial", 'file/se.png'],
  ["BR-TO", 442962, 467916, "parcial", 'file/to.png'],
];

/* ============================================================
   1º TURNO (base da comparação)
   ["SIGLA", votos Lula, votos Flávio]
   ============================================================ */
var TURNO1 = [
  ["BR-AC", 134770, 302807],
  ["BR-AL", 995459, 735718],
  ["BR-AP", 212503, 212278],
  ["BR-AM", 1046996, 976764],
  ["BR-BA", 5664771, 2442585],
  ["BR-CE", 3555263, 1756850],
  ["BR-DF", 675627, 909616],
  ["BR-ES", 850028, 1233194],
  ["BR-GO", 1188880, 2051888],
  ["BR-MA", 2566301, 1239040],
  ["BR-MT", 581681, 1298581],
  ["BR-MS", 516855, 873351],
  ["BR-MG", 5188936, 5777548],
  ["BR-PA", 2427237, 2163957],
  ["BR-PB", 1541127, 831377],
  ["BR-PR", 2054597, 3945345],
  ["BR-PE", 3553971, 1738043],
  ["BR-PI", 1523710, 517028],
  ["BR-RJ", 3693021, 4966844],
  ["BR-RN", 1237963, 720493],
  ["BR-RS", 2294759, 3573783],
  ["BR-RO", 250667, 652988],
  ["BR-RR", 74420, 231322],
  ["BR-SC", 1127168, 3000020],
  ["BR-SP", 9505413, 12922023],
  ["BR-SE", 856019, 417839],
  ["BR-TO", 404009, 469321],
];
/* ============================================================ */

var NAMES={PT:"Portugal",US:"Estados Unidos",GB:"Reino Unido",FR:"França",DE:"Alemanha",IT:"Itália",ES:"Espanha",CH:"Suíça",JP:"Japão",CN:"China",AR:"Argentina",PY:"Paraguai",UY:"Uruguai",CL:"Chile",BO:"Bolívia",PE:"Peru",CO:"Colômbia",VE:"Venezuela",EC:"Equador",MX:"México",CA:"Canadá",AU:"Austrália",NZ:"Nova Zelândia",IE:"Irlanda",NL:"Holanda",BE:"Bélgica",LU:"Luxemburgo",AT:"Áustria",SE:"Suécia",NO:"Noruega",DK:"Dinamarca",FI:"Finlândia",AO:"Angola",MZ:"Moçambique",CV:"Cabo Verde",ZA:"África do Sul",EG:"Egito",MA:"Marrocos",IL:"Israel",AE:"Emirados Árabes",QA:"Catar",SA:"Arábia Saudita",TR:"Turquia",RU:"Rússia",PL:"Polônia",GR:"Grécia",IN:"Índia",KR:"Coreia do Sul",TH:"Tailândia",CU:"Cuba",PA:"Panamá",CR:"Costa Rica",GF:"Guiana Francesa",SR:"Suriname",GY:"Guiana",HT:"Haiti",LB:"Líbano"};
var UF={AC:"Acre",AL:"Alagoas",AP:"Amapá",AM:"Amazonas",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",MA:"Maranhão",MT:"Mato Grosso",MS:"Mato Grosso do Sul",MG:"Minas Gerais",PA:"Pará",PB:"Paraíba",PR:"Paraná",PE:"Pernambuco",PI:"Piauí",RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RS:"Rio Grande do Sul",RO:"Rondônia",RR:"Roraima",SC:"Santa Catarina",SP:"São Paulo",SE:"Sergipe",TO:"Tocantins"};
Object.keys(UF).forEach(function(k){NAMES["BR-"+k]=UF[k]});

var fmt=new Intl.NumberFormat("pt-BR");
function pct(a,b){return a+b?a/(a+b)*100:50}
function p1(n){return n.toFixed(1).replace(".",",")+"%"}

/* monta o mapa do 1º turno por sigla */
var T1={};
TURNO1.forEach(function(r){T1[String(r[0]).toUpperCase()]=[+r[1]||0,+r[2]||0]});

/* preenche um elemento com a diferença: + verde, - vermelho */
function setDif(el,atual,antes){
  var d=atual-antes;
  el.classList.remove("up","down","eq");
  if(d>0){el.textContent="+"+fmt.format(d);el.classList.add("up")}
  else if(d<0){el.textContent="-"+fmt.format(-d);el.classList.add("down")}
  else{el.textContent="=";el.classList.add("eq")}
  el.title="1º turno: "+fmt.format(antes)+" votos";
}

var tl=0,tf=0,t1l=0,t1f=0,temT1=false,list=document.getElementById("list"),bars=[];
PAISES.forEach(function(p){
  var code=String(p[0]).toUpperCase(),l=Math.max(0,+p[1]||0),f=Math.max(0,+p[2]||0);
  var final=String(p[3]||"parcial").toLowerCase()==="total";
  var src=p[4]||("https://flagcdn.com/w80/"+code.toLowerCase()+".png");
  tl+=l;tf+=f;
  var el=document.createElement("div");el.className="row";
  el.innerHTML='<div class="who"><img alt="" width="36" height="27"><b></b></div>'+
  '<div class="num lula"></div>'+
  '<div class="bar"><div class="track sm"><div class="seg l" style="width:50%"></div><div class="seg f" style="width:50%"></div><div class="mid"></div><div class="sweep"></div></div><small><span class="lula"></span><span class="flavio"></span></small></div>'+
  '<div class="num flavio"></div>';
  el.querySelector("b").textContent=NAMES[code]||code;
  var img=el.querySelector("img");
  img.onerror=function(){
    var fb=document.createElement("span");fb.className="fb";
    fb.textContent=code.split("-").pop();
    this.parentNode.replaceChild(fb,this);
  };
  img.src=src;
  var nums=el.querySelectorAll(".num");
  nums[0].textContent=fmt.format(l);nums[1].textContent=fmt.format(f);
  if(l!==f){
    var ic=document.createElement("span");ic.className="ic";
    ic.textContent=final?"":"";
    ic.title=final?"Venceu (apuração concluída)":"Lidera (apuração parcial)";
    nums[l>f?0:1].insertBefore(ic,nums[l>f?0:1].firstChild);
  }
  /* comparação com o 1º turno */
  if(T1[code]){
    temT1=true;
    t1l+=T1[code][0];t1f+=T1[code][1];
    var dl=document.createElement("span");dl.className="dif";
    var df=document.createElement("span");df.className="dif";
    setDif(dl,l,T1[code][0]);
    setDif(df,f,T1[code][1]);
    nums[0].appendChild(dl);
    nums[1].appendChild(df);
    var ol=document.createElement("span");ol.className="t1";
    var of=document.createElement("span");of.className="t1";
    ol.textContent="1º turno: "+fmt.format(T1[code][0]);
    of.textContent="1º turno: "+fmt.format(T1[code][1]);
    nums[0].appendChild(ol);
    nums[1].appendChild(of);
  }
  var sp=el.querySelectorAll(".bar small span");
  sp[0].textContent=l+f?p1(pct(l,f)):"–";sp[1].textContent=l+f?p1(100-pct(l,f)):"–";
  bars.push([el,pct(l,f)]);
  list.appendChild(el);
});
document.getElementById("empty").style.display=PAISES.length?"none":"block";
document.querySelector(".head").style.visibility=PAISES.length?"visible":"hidden";

var p=pct(tl,tf);
document.getElementById("pl").textContent=tl+tf?p1(p):"0%";
document.getElementById("pf").textContent=tl+tf?p1(100-p):"0%";
document.getElementById("nl").textContent=fmt.format(tl)+" votos";
document.getElementById("nf").textContent=fmt.format(tf)+" votos";
if(temT1){
  setDif(document.getElementById("dl"),tl,t1l);
  setDif(document.getElementById("df"),tf,t1f);
  ["dl","df"].forEach(function(id,i){
    var s=document.createElement("span");s.className="t1";
    s.textContent="1º turno: "+fmt.format(i?t1f:t1l)+" votos";
    document.getElementById(id).after(s);
  });
}
var t="Total · "+PAISES.length+(PAISES.length===1?" local":" locais");
t+=tl+tf===0?" · nenhum voto lançado":tl===tf?" · empate técnico":" · "+(tl>tf?"Lula":"Flávio")+" lidera por "+fmt.format(Math.abs(tl-tf))+" votos";
document.getElementById("lead").textContent=t;

/* animação de entrada das barras */
requestAnimationFrame(function(){requestAnimationFrame(function(){
  document.getElementById("bl").style.width=p+"%";
  document.getElementById("bf").style.width=(100-p)+"%";
  bars.forEach(function(b){
    b[0].querySelector(".seg.l").style.width=b[1]+"%";
    b[0].querySelector(".seg.f").style.width=(100-b[1])+"%";
  });
})});

/* recarrega a página a cada 60s pra quem está assistindo ver os números novos */
setTimeout(function(){location.reload()},60000);
</script>
</body>
</html>
